}

async function viewCountDetail(countId) {
  const { data: count } = await db.from('physical_counts').select('*').eq('id', countId).single();
  const { data: items } = await db.from('physical_count_items').select('*').eq('count_id', countId).order('status');

  if (!count || !items) return toast('Count not found', 'error');

  const found = items.filter(i => i.status === 'found');
  const missing = items.filter(i => i.status === 'missing');
  const accuracy = count.expected_count > 0 ? ((count.found_count / count.expected_count) * 100).toFixed(1) : '100.0';

  const resolutionLabels = {
    found_later: 'Found Later',
    lost: 'Lost',
    stolen: 'Stolen',
    damaged: 'Damaged',
    data_error: 'Data Entry Error'
  };

  openModal(`
    <div class="modal-title">Count Detail — ${new Date(count.counted_at).toLocaleString()}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:16px;">
      <div style="text-align:center;padding:10px;background:var(--sidebar-hover);border-radius:7px;">
        <div style="font-size:11px;color:var(--text-muted);">Expected</div>
        <div style="font-size:20px;font-weight:700;">${count.expected_count}</div>
      </div>
      <div style="text-align:center;padding:10px;background:var(--sidebar-hover);border-radius:7px;">
        <div style="font-size:11px;color:var(--text-muted);">Found</div>
        <div style="font-size:20px;font-weight:700;color:var(--success);">${count.found_count}</div>
      </div>
      <div style="text-align:center;padding:10px;background:var(--sidebar-hover);border-radius:7px;">
        <div style="font-size:11px;color:var(--text-muted);">Missing</div>
        <div style="font-size:20px;font-weight:700;color:var(--danger);">${count.missing_count}</div>
      </div>
      <div style="text-align:center;padding:10px;background:var(--sidebar-hover);border-radius:7px;">
        <div style="font-size:11px;color:var(--text-muted);">Accuracy</div>
        <div style="font-size:20px;font-weight:700;">${accuracy}%</div>
      </div>
    </div>
    ${missing.length ? `
      <div style="font-weight:600;font-size:14px;margin-bottom:8px;">Missing Phones</div>
      <div class="table-wrap" style="max-height:300px;overflow-y:auto;">
        <table>
          <thead><tr><th>IMEI</th><th>Model</th><th>Resolution</th></tr></thead>
          <tbody>
            ${missing.map(m => `
              <tr>
                <td style="font-family:monospace;font-size:12px;">${m.imei}</td>
                <td>${m.model}</td>
                <td>${m.resolution ? `<span class="badge badge-${m.resolution === 'found_later' ? 'available' : 'sold'}">${resolutionLabels[m.resolution] || m.resolution}</span>` : '<span class="badge badge-missing">Unresolved</span>'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    ` : '<p style="color:var(--success);font-size:14px;">✅ No missing phones in this count</p>'}
    <div style="margin-top:16px;">
      <button class="btn btn-outline btn-sm" onclick="closeModal()">Close</button>
    </div>
  `);
}

// ─── LABELS ───
async function renderLabels() {
  const main = document.getElementById('mainContent');
  main.innerHTML = loading();

  const { data: phones } = await db.from('phones').select('*').eq('store_id', currentStore.id).eq('status', 'available').order('brand');
  const list = phones || [];

  main.innerHTML = `
    <h2 style="margin-bottom:16px;">Print Labels</h2>
    <div class="card" style="max-width:700px;">
      <div class="search-bar">
        <input type="text" id="labelSearch" placeholder="Search phones..." oninput="filterLabels()">
      </div>
      <div style="margin-bottom:12px;">
        <label style="font-size:13px;display:flex;align-items:center;gap:6px;">
          <input type="checkbox" id="selectAllLabels" onchange="toggleAllLabels()"> Select All
        </label>
      </div>
      <div id="labelList">
        ${list.map((p, i) => `
          <div class="count-row" data-label-row>
            <label style="display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;">
              <input type="checkbox" class="label-check" value="${i}">
              <div class="count-info">
                <div class="count-model">${p.brand} ${p.model} ${p.storage || ''} ${p.color || ''}</div>
                <div class="count-imei">${p.imei} — ${fmt(p.retail_price)}</div>
              </div>
            </label>
          </div>
        `).join('')}
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="printLabels()">Print Selected Labels</button>
    </div>
  `;

  window._labelData = list;
}

function filterLabels() {
  const q = document.getElementById('labelSearch').value.toLowerCase();
  document.querySelectorAll('[data-label-row]').forEach((row, i) => {
    const p = window._labelData[i];
    const match = !q || p.imei.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q) || p.model.toLowerCase().includes(q);
    row.style.display = match ? '' : 'none';
  });
}

function toggleAllLabels() {
  const checked = document.getElementById('selectAllLabels').checked;
  document.querySelectorAll('.label-check').forEach(cb => cb.checked = checked);
}

function printLabels() {
  const checked = Array.from(document.querySelectorAll('.label-check:checked'));
  if (!checked.length) return toast('Select at least one phone', 'error');

  const phones = checked.map(cb => window._labelData[cb.value]);
  const storeName = currentStore.name;

  const labelsHtml = phones.map(p => `
    <div class="label-card">
      <div class="label-store">${storeName}</div>
      <div class="label-model">${p.brand} ${p.model}</div>
      <div class="label-specs">${[p.storage, p.color, p.condition].filter(Boolean).join(' • ')}</div>
      <svg id="bc-${p.imei}"></svg>
      <div class="label-price">${fmt(p.retail_price)}</div>
    </div>
  `).join('');

  const printWindow = window.open('', '_blank');
  printWindow.document.write(`
    <!DOCTYPE html>
    <html>
    <head>
      <title>Labels</title>
      <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"><\/script>
      <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, Helvetica, sans-serif; }
        @page {
          size: 3.5in 1.125in;
          margin: 0;
        }
        .label-card {
          width: 3.5in;
          height: 1.125in;
          padding: 4px 8px;
          text-align: center;
          page-break-after: always;
          page-break-inside: avoid;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          overflow: hidden;
        }
        .label-store {
          font-size: 7px;
          text-transform: uppercase;
          letter-spacing: 0.5px;
          color: #333;
          margin-bottom: 1px;
        }
        .label-model {
          font-size: 11px;
          font-weight: 700;
          margin-bottom: 1px;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
          max-width: 3.3in;
        }
        .label-specs {
          font-size: 8px;
          color: #555;
          margin-bottom: 2px;
          white-space: nowrap;
        }
        .label-barcode {
          max-width: 3in;
          height: auto;
        }
        .label-price {
          font-size: 16px;
          font-weight: 900;
          margin-top: 1px;
        }
        @media print {
          body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
      </style>
    </head>
    <body>
      ${labelsHtml}
      <script>
        window.onload = function() {
          ${phones.map(p => `try { JsBarcode("#bc-${p.imei}", "${p.imei}", { format: "CODE128", width: 1.2, height: 28, fontSize: 9, margin: 0, displayValue: true }); } catch(e) {}`).join('\n          ')}
          setTimeout(function() { window.print(); }, 200);
        };
      <\/script>
    </body>
    </html>
  `);
  printWindow.document.close();
}

// ─── STAFF MANAGEMENT ───
async function renderStaffManagement() {
  const main = document.getElementById('mainContent');
  main.innerHTML = loading();

  const { data: staffList } = await db.from('staff').select('*').order('name');
  const { data: staffStores } = await db.from('staff_stores').select('*');

  const list = staffList || [];
  const assignments = staffStores || [];

  main.innerHTML = `
    <h2 style="margin-bottom:16px;">Staff Management</h2>
    <div style="margin-bottom:16px;">
      <button class="btn btn-primary" onclick="showAddStaffModal()">+ Add Staff Member</button>
    </div>
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>PIN</th><th>Assigned Stores</th><th>Created</th><th></th></tr></thead>
          <tbody>
            ${list.length ? list.map(s => {
              const stores = assignments.filter(a => a.staff_id === s.id).map(a => allStores.find(st => st.id === a.store_id)?.name || '?');
              return `<tr>
                <td><strong>${s.name}</strong></td>
                <td style="font-family:monospace;letter-spacing:2px;">${s.pin}</td>
                <td>${stores.length ? stores.join(', ') : '<span style="color:var(--text-muted);">None</span>'}</td>
                <td>${fmtDate(s.created_at)}</td>
                <td>
                  <div style="display:flex;gap:4px;">
                    <button class="btn btn-outline btn-sm" onclick="editStaffMember('${s.id}')">Edit</button>
                    ${s.pin !== ADMIN_PIN ? `<button class="btn btn-outline btn-sm" style="color:var(--danger);" onclick="deleteStaffMember('${s.id}','${s.name}')">Delete</button>` : ''}
                  </div>
                </td>
              </tr>`;
            }).join('') : `<tr><td colspan="5">${emptyState('No staff members yet. Add your first one.')}</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function showAddStaffModal() {
  openModal(`
    <div class="modal-title">Add Staff Member</div>
    <div class="form-group">
      <label>Name *</label>
      <input type="text" id="staffName" placeholder="Full name">
    </div>
    <div class="form-group">
      <label>4-Digit PIN *</label>
      <input type="text" id="staffPin" maxlength="4" placeholder="e.g. 1234" style="font-family:monospace;letter-spacing:4px;font-size:18px;">
      <small id="staffPinHint" style="font-size:12px;color:var(--text-muted);"></small>
    </div>
    <div class="form-group">
      <label>Assigned Stores *</label>
      <div id="staffStoreChecks" style="display:flex;flex-direction:column;gap:8px;">
        ${allStores.map(s => `
          <label style="font-size:14px;display:flex;align-items:center;gap:10px;cursor:pointer;padding:6px 10px;border-radius:6px;border:0.5px solid var(--border);background:var(--bg-input);">
            <input type="checkbox" class="staff-store-check" value="${s.id}"> ${s.name}
          </label>
        `).join('')}
      </div>
      <div style="margin-top:6px;">
        <label style="font-size:12px;color:var(--primary);cursor:pointer;text-decoration:underline;" onclick="document.querySelectorAll('.staff-store-check').forEach(c=>c.checked=true)">Select all</label>
      </div>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-primary btn-block" onclick="saveNewStaff()">Save</button>
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
    </div>
  `);
}

async function saveNewStaff() {
  const name = document.getElementById('staffName').value.trim();
  const pin = document.getElementById('staffPin').value.trim();

  if (!name) return toast('Enter a name', 'error');
  if (!/^\d{4}$/.test(pin)) return toast('PIN must be exactly 4 digits', 'error');

  // Check PIN uniqueness
  const { data: existing } = await db.from('staff').select('id').eq('pin', pin);
  if (existing && existing.length > 0) return toast('This PIN is already in use', 'error');

  const storeIds = Array.from(document.querySelectorAll('.staff-store-check:checked')).map(c => c.value);
  if (!storeIds.length) return toast('Select at least one store', 'error');

  const { data: newStaff, error } = await db.from('staff').insert([{ name, pin }]).select().single();
  if (error) return toast('Failed to add staff: ' + error.message, 'error');

  // Assign stores
  const storeAssignments = storeIds.map(sid => ({ staff_id: newStaff.id, store_id: sid }));
  await db.from('staff_stores').insert(storeAssignments);

  toast(`${name} added successfully!`);
  closeModal();
  renderStaffManagement();
}

async function editStaffMember(staffId) {
  const { data: s } = await db.from('staff').select('*').eq('id', staffId).single();
  if (!s) return;

  const { data: assignments } = await db.from('staff_stores').select('store_id').eq('staff_id', staffId);
  const assignedIds = (assignments || []).map(a => a.store_id);

  openModal(`
    <div class="modal-title">Edit Staff — ${s.name}</div>
    <div class="form-group">
      <label>Name *</label>
      <input type="text" id="editStaffName" value="${s.name}">
    </div>
    <div class="form-group">
      <label>4-Digit PIN *</label>
      <input type="text" id="editStaffPin" maxlength="4" value="${s.pin}" style="font-family:monospace;letter-spacing:4px;font-size:18px;">
    </div>
    <div class="form-group">
      <label>Assigned Stores *</label>
      <div id="editStaffStoreChecks" style="display:flex;flex-direction:column;gap:8px;">
        ${allStores.map(st => `
          <label style="font-size:14px;display:flex;align-items:center;gap:10px;cursor:pointer;padding:6px 10px;border-radius:6px;border:0.5px solid var(--border);background:var(--bg-input);">
            <input type="checkbox" class="edit-staff-store-check" value="${st.id}" ${assignedIds.includes(st.id) ? 'checked' : ''}> ${st.name}
          </label>
        `).join('')}
      </div>
      <div style="margin-top:6px;">
        <label style="font-size:12px;color:var(--primary);cursor:pointer;text-decoration:underline;" onclick="document.querySelectorAll('.edit-staff-store-check').forEach(c=>c.checked=true)">Select all</label>
      </div>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-primary btn-block" onclick="updateStaff('${staffId}')">Save Changes</button>
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
    </div>
  `);
}

async function updateStaff(staffId) {
  const name = document.getElementById('editStaffName').value.trim();
  const pin = document.getElementById('editStaffPin').value.trim();

  if (!name) return toast('Enter a name', 'error');
  if (!/^\d{4}$/.test(pin)) return toast('PIN must be exactly 4 digits', 'error');

  // Check PIN uniqueness (excluding self)
  const { data: existing } = await db.from('staff').select('id').eq('pin', pin).neq('id', staffId);
  if (existing && existing.length > 0) return toast('This PIN is already in use by another staff member', 'error');

  const storeIds = Array.from(document.querySelectorAll('.edit-staff-store-check:checked')).map(c => c.value);
  if (!storeIds.length) return toast('Select at least one store', 'error');

  const { error } = await db.from('staff').update({ name, pin }).eq('id', staffId);
  if (error) return toast('Failed to update: ' + error.message, 'error');

  // Re-assign stores: delete old, insert new
  await db.from('staff_stores').delete().eq('staff_id', staffId);
  const storeAssignments = storeIds.map(sid => ({ staff_id: staffId, store_id: sid }));
  await db.from('staff_stores').insert(storeAssignments);

  toast(`${name} updated!`);
  closeModal();
  renderStaffManagement();
}

async function deleteStaffMember(staffId, name) {
  openModal(`
    <div class="modal-title">Delete Staff Member</div>
    <p style="margin-bottom:16px;">Are you sure you want to remove <strong>${name}</strong>? This cannot be undone.</p>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-danger btn-block" onclick="confirmDeleteStaff('${staffId}')">Delete</button>
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
    </div>
  `);
}

async function confirmDeleteStaff(staffId) {
  await db.from('staff_stores').delete().eq('staff_id', staffId);
  const { error } = await db.from('staff').delete().eq('id', staffId);
  if (error) return toast('Failed to delete: ' + error.message, 'error');

  toast('Staff member removed');
  closeModal();
  renderStaffManagement();
}
