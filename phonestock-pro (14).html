<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gurus CPR PhoneStock</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
:root {
  --primary: #C41E24;
  --primary-light: #d63030;
  --primary-dark: #9a1519;
  --success: #3B6D11;
  --success-light: #4a8a16;
  --warning: #854F0B;
  --warning-light: #a0640f;
  --danger: #A32D2D;
  --danger-light: #bf3636;
  --bg: #f4f6f9;
  --bg-card: #ffffff;
  --bg-input: #ffffff;
  --text: #1a1a2e;
  --text-secondary: #555770;
  --text-muted: #8889a0;
  --border: rgba(0,0,0,0.08);
  --shadow: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-lg: 0 4px 12px rgba(0,0,0,0.08);
  --radius: 10px;
  --header-bg: #C41E24;
  --header-text: #ffffff;
  --sidebar-bg: #ffffff;
  --sidebar-hover: #f0f4f8;
  --sidebar-active: #fee8e8;
  --badge-bg: #fee8e8;
  --badge-text: #C41E24;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1117;
    --bg-card: #1a1c25;
    --bg-input: #22242e;
    --text: #e4e4ec;
    --text-secondary: #a0a1b2;
    --text-muted: #6b6c82;
    --border: rgba(255,255,255,0.08);
    --shadow: 0 1px 3px rgba(0,0,0,0.3);
    --shadow-lg: 0 4px 12px rgba(0,0,0,0.4);
    --header-bg: #141620;
    --header-text: #e4e4ec;
    --sidebar-bg: #1a1c25;
    --sidebar-hover: #22242e;
    --sidebar-active: #3a1e1e;
    --badge-bg: #3a1e1e;
    --badge-text: #ff6a6a;
  }
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* HEADER */
.header {
  background: var(--header-bg);
  color: var(--header-text);
  padding: 0 20px;
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  box-shadow: 0 1px 4px rgba(0,0,0,0.15);
}

.header-logo {
  font-size: 18px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}

.header-logo svg { width: 24px; height: 24px; }

.header-store {
  font-size: 13px;
  opacity: 0.85;
  background: rgba(255,255,255,0.15);
  padding: 4px 12px;
  border-radius: 20px;
}

.header-menu-btn {
  display: none;
  background: none;
  border: none;
  color: var(--header-text);
  font-size: 22px;
  cursor: pointer;
  padding: 4px;
}

/* LAYOUT */
.layout {
  display: flex;
  padding-top: 54px;
  min-height: 100vh;
}

/* SIDEBAR */
.sidebar {
  width: 220px;
  background: var(--sidebar-bg);
  border-right: 0.5px solid var(--border);
  position: fixed;
  top: 54px;
  bottom: 0;
  left: 0;
  overflow-y: auto;
  z-index: 90;
  transition: transform 0.25s ease;
}

.sidebar-nav { padding: 10px 8px; }

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  color: var(--text-secondary);
  transition: all 0.15s;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  font-family: inherit;
}

.nav-item:hover { background: var(--sidebar-hover); color: var(--text); }
.nav-item.active { background: var(--sidebar-active); color: var(--primary); font-weight: 600; }
.nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }

/* MAIN */
.main {
  flex: 1;
  margin-left: 220px;
  padding: 24px;
  max-width: 1200px;
}

/* CARDS */
.card {
  background: var(--bg-card);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}

.card-title {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* METRIC CARDS */
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}

.metric-card {
  background: var(--bg-card);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}

.metric-label {
  font-size: 12px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}

.metric-value {
  font-size: 26px;
  font-weight: 700;
  color: var(--text);
}

.metric-value.green { color: var(--success); }
.metric-value.blue { color: var(--primary); }
.metric-value.amber { color: var(--warning); }
.metric-value.red { color: var(--danger); }

/* FORMS */
.form-group { margin-bottom: 14px; }

.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 5px;
}

.form-group input, .form-group select, .form-group textarea {
  width: 100%;
  padding: 9px 12px;
  border: 0.5px solid var(--border);
  border-radius: 7px;
  font-size: 14px;
  background: var(--bg-input);
  color: var(--text);
  font-family: inherit;
  transition: border-color 0.15s;
}

.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(196,30,36,0.12);
}

.form-group textarea { resize: vertical; min-height: 60px; }

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.form-row-3 {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
}

/* BUTTONS */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 9px 18px;
  border-radius: 7px;
  font-size: 14px;
  font-weight: 500;
  border: none;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
}

.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-light); }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover { background: var(--success-light); }
.btn-warning { background: var(--warning); color: #fff; }
.btn-warning:hover { background: var(--warning-light); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: var(--danger-light); }
.btn-outline {
  background: transparent;
  border: 0.5px solid var(--border);
  color: var(--text-secondary);
}
.btn-outline:hover { background: var(--sidebar-hover); }
.btn-sm { padding: 6px 12px; font-size: 13px; }
.btn-block { width: 100%; }

/* TABLES */
.table-wrap { overflow-x: auto; }

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

th {
  text-align: left;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  font-weight: 600;
  color: var(--text-secondary);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  white-space: nowrap;
}

td {
  padding: 10px 12px;
  border-bottom: 0.5px solid var(--border);
  white-space: nowrap;
}

tr:hover { background: var(--sidebar-hover); }

/* BADGES */
.badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
}

.badge-available { background: #e8f5e9; color: #2e7d32; }
.badge-sold { background: #fce4ec; color: #c62828; }
.badge-transferred { background: #fee8e8; color: #C41E24; }
.badge-active { background: #e8f5e9; color: #2e7d32; }
.badge-expired { background: #fce4ec; color: #c62828; }
.badge-found { background: #e8f5e9; color: #2e7d32; }
.badge-missing { background: #fff3e0; color: #e65100; }

@media (prefers-color-scheme: dark) {
  .badge-available { background: #1b3a1f; color: #66bb6a; }
  .badge-sold { background: #3a1a1f; color: #ef5350; }
  .badge-transferred { background: #3a1a1a; color: #ff6a6a; }
  .badge-active { background: #1b3a1f; color: #66bb6a; }
  .badge-expired { background: #3a1a1f; color: #ef5350; }
  .badge-found { background: #1b3a1f; color: #66bb6a; }
  .badge-missing { background: #3a2a1a; color: #ffa726; }
}

/* SEARCH */
.search-bar {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
}

.search-bar input {
  flex: 1;
  padding: 9px 14px;
  border: 0.5px solid var(--border);
  border-radius: 7px;
  font-size: 14px;
  background: var(--bg-input);
  color: var(--text);
  font-family: inherit;
}

.search-bar input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(196,30,36,0.12);
}

/* TABS */
.tabs {
  display: flex;
  gap: 2px;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--border);
}

.tab {
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-muted);
  background: none;
  border: none;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  font-family: inherit;
  transition: all 0.15s;
}

.tab.active { color: var(--primary); border-bottom-color: var(--primary); }
.tab:hover { color: var(--text); }

/* MODAL */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-overlay.show { display: flex; }

.modal {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 24px;
  max-width: 500px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
}

.modal-title {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 16px;
}

/* TOAST */
.toast-container {
  position: fixed;
  top: 64px;
  right: 20px;
  z-index: 300;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.toast {
  padding: 12px 18px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  color: #fff;
  animation: slideIn 0.3s ease;
  box-shadow: var(--shadow-lg);
}

.toast-success { background: var(--success); }
.toast-error { background: var(--danger); }
.toast-info { background: var(--primary); }

@keyframes slideIn {
  from { opacity: 0; transform: translateX(40px); }
  to { opacity: 1; transform: translateX(0); }
}

/* STORE SELECTOR */
.store-selector-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.store-selector-card {
  background: var(--bg-card);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  padding: 32px;
  max-width: 420px;
  width: 100%;
  box-shadow: var(--shadow-lg);
  text-align: center;
}

.store-selector-card h1 {
  font-size: 22px;
  margin-bottom: 6px;
  color: var(--primary);
}

.store-selector-card p {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 20px;
}

.store-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.store-btn {
  padding: 12px;
  border: 0.5px solid var(--border);
  border-radius: 8px;
  background: var(--bg-input);
  color: var(--text);
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
}

.store-btn:hover {
  background: var(--sidebar-active);
  border-color: var(--primary);
}

/* PRINT LABEL */
.print-area {
  display: none;
}

@media print {
  @page {
    size: 3.5in 1.125in;
    margin: 0;
  }
  body * { display: none !important; }
  .print-area { display: block !important; }
  .print-area * { display: block !important; }
  .label-card {
    width: 3.5in;
    height: 1.125in;
    padding: 4px 8px;
    text-align: center;
    page-break-after: always;
    page-break-inside: avoid;
    display: flex !important;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    box-sizing: border-box;
  }
  .label-store {
    font-size: 7px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #333;
    margin-bottom: 1px;
  }
  .label-model {
    font-size: 11px;
    font-weight: 700;
    margin-bottom: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 3.3in;
  }
  .label-specs {
    font-size: 8px;
    color: #555;
    margin-bottom: 2px;
    white-space: nowrap;
  }
  .label-barcode {
    display: block !important;
    max-width: 3in;
    height: auto;
  }
  .label-price {
    font-size: 16px;
    font-weight: 900;
    margin-top: 1px;
  }
}

/* EMPTY STATE */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
}

.empty-state svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.4; }
.empty-state p { font-size: 14px; }

/* LOADING */
.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
  color: var(--text-muted);
  font-size: 14px;
  gap: 8px;
}

.spinner {
  width: 18px; height: 18px;
  border: 2px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* RESPONSIVE */
@media (max-width: 768px) {
  .header-menu-btn { display: block; }
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); box-shadow: var(--shadow-lg); }
  .main { margin-left: 0; padding: 16px; }
  .form-row, .form-row-3 { grid-template-columns: 1fr; }
  .metrics-grid { grid-template-columns: repeat(2, 1fr); }
  .header-store { display: none; }
}

/* PHYSICAL COUNT */
.count-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 0.5px solid var(--border);
}

.count-row:last-child { border-bottom: none; }

.count-info { flex: 1; }
.count-info .count-model { font-weight: 600; font-size: 14px; }
.count-info .count-imei { font-size: 12px; color: var(--text-muted); font-family: monospace; }

.count-actions { display: flex; gap: 6px; }
</style>
</head>

        <button class="btn btn-outline btn-sm btn-block" onclick="changeStore()">Change Store</button>

    </nav>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main" id="mainContent"></main>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>

// ─── INIT ───
async function init() {
  try {
    const { data: stores, error } = await db.from('stores').select('*').order('name');
    if (error) {
      document.getElementById('storeSelectorMsg').textContent = 'Select your store location to get started';
      document.getElementById('storeList').innerHTML = '<p style="color:var(--danger);font-size:14px;">❌ Database connection failed:<br>' + error.message + '<br><br>Check that you ran the SQL setup in Supabase and that RLS policies are enabled.</p>';
      return;
    }
    if (!stores || stores.length === 0) {
      document.getElementById('storeSelectorMsg').textContent = 'Select your store location to get started';
      document.getElementById('storeList').innerHTML = '<p style="color:var(--warning);font-size:14px;">⚠️ No stores found in database.<br><br>Run the SQL setup script in Supabase SQL Editor first.</p>';
      return;
    }
    allStores = stores;

    const savedStoreId = localStorage.getItem('phonestock_store_id');
    if (savedStoreId) {
      currentStore = allStores.find(s => s.id === savedStoreId);
    }

    if (currentStore) {
      // Check for saved staff session
      const savedStaffId = localStorage.getItem('phonestock_staff_id');
      if (savedStaffId) {
        const { data: staff } = await db.from('staff').select('*').eq('id', savedStaffId).single();
        if (staff) {
          // Verify still has access
          const { data: access } = await db.from('staff_stores').select('*').eq('staff_id', staff.id).eq('store_id', currentStore.id);
          if (access && access.length > 0) {
            currentStaff = staff;
            showApp();
            return;
          }
        }
      }
      showPinScreen();
    } else {
      showStoreSelector();
    }
  } catch (err) {
    document.getElementById('storeSelectorMsg').textContent = 'Connection Error';
    document.getElementById('storeList').innerHTML = '<p style="color:var(--danger);font-size:14px;">❌ Could not connect to Supabase:<br>' + err.message + '<br><br>Make sure you have internet access.</p>';
  }
}

      <div id="pinError" style="color:var(--danger);font-size:13px;margin-bottom:12px;min-height:20px;"></div>

function pinNext(n) {
  const input = document.getElementById('pinInput' + n);
  if (input.value.length === 1 && n < 4) {
    document.getElementById('pinInput' + (n + 1)).focus();
  }
  if (n === 4 && input.value.length === 1) {
    verifyPin();
  }
}

function pinKeydown(e, n) {
  if (e.key === 'Backspace' && !e.target.value && n > 1) {
    document.getElementById('pinInput' + (n - 1)).focus();
  }
}

async function verifyPin() {
  const pin = [1,2,3,4].map(n => document.getElementById('pinInput' + n).value).join('');
  if (pin.length !== 4) {
    document.getElementById('pinError').textContent = 'Enter all 4 digits';
    return;
  }

  // Check staff with this PIN
  const { data: staff } = await db.from('staff').select('*').eq('pin', pin);
  if (!staff || staff.length === 0) {
    document.getElementById('pinError').textContent = 'Invalid PIN';
    [1,2,3,4].forEach(n => { document.getElementById('pinInput' + n).value = ''; });
    document.getElementById('pinInput1').focus();
    return;
  }

  const member = staff[0];

  // Check if staff has access to this store
  const { data: access } = await db.from('staff_stores').select('*').eq('staff_id', member.id).eq('store_id', currentStore.id);
  if (!access || access.length === 0) {
    document.getElementById('pinError').textContent = 'You don\'t have access to ' + currentStore.name;
    [1,2,3,4].forEach(n => { document.getElementById('pinInput' + n).value = ''; });
    document.getElementById('pinInput1').focus();
    return;
  }

  currentStaff = member;
  localStorage.setItem('phonestock_staff_id', member.id);
  showApp();
}

function lockScreen() {
  currentStaff = null;
  localStorage.removeItem('phonestock_staff_id');
  clearInactivityTimer();
  showPinScreen();
}

// ─── INACTIVITY TIMER ───
function resetInactivityTimer() {
  clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(() => {
    if (currentStaff) {
      toast('Logged out due to inactivity', 'info');
      lockScreen();
    }
  }, INACTIVITY_TIMEOUT);
}

function clearInactivityTimer() {
  clearTimeout(inactivityTimer);
}

function setupInactivityListeners() {
  ['click', 'keydown', 'mousemove', 'touchstart'].forEach(evt => {
    document.addEventListener(evt, resetInactivityTimer);
  });
  resetInactivityTimer();
}

function showApp() {
  document.getElementById('storeSelector').style.display = 'none';

  document.getElementById('appLayout').style.display = 'flex';
  document.getElementById('headerStore').textContent = currentStore.name + (currentStaff ? ' • ' + currentStaff.name : '');

  // Staff page is admin-only
  if (page === 'staff' && (!currentStaff || currentStaff.pin !== ADMIN_PIN)) {
    toast('Admin access required', 'error');
    return;
  }

  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.page === page));

  // Show/hide staff nav item for admin
  const staffNav = document.getElementById('staffNavItem');
  if (staffNav) staffNav.style.display = (currentStaff && currentStaff.pin === ADMIN_PIN) ? 'flex' : 'none';

  const pages = {
    dashboard: renderDashboard,
    inventory: renderInventory,
    addphone: renderAddPhone,
    sell: renderSell,
    transfer: renderTransfer,
    warranty: renderWarranty,
    count: renderCount,

// ─── DASHBOARD ───
async function renderDashboard() {
  const main = document.getElementById('mainContent');
  main.innerHTML = loading();

  const [phonesRes, salesRes] = await Promise.all([
    db.from('phones').select('*').eq('store_id', currentStore.id),
    db.from('sales').select('*').eq('store_id', currentStore.id).order('sale_date', { ascending: false })
  ]);

  const phones = phonesRes.data || [];
  const sales = salesRes.data || [];

  const available = phones.filter(p => p.status === 'available');
  const sold = phones.filter(p => p.status === 'sold');
  const revenue = sales.reduce((a, s) => a + Number(s.sale_price || 0), 0);

  // Today's sales
  const today = new Date().toDateString();
  const todaySales = sales.filter(s => new Date(s.sale_date).toDateString() === today);
  const todayRevenue = todaySales.reduce((a, s) => a + Number(s.sale_price || 0), 0);

  // This month's sales
  const now = new Date();
  const monthSales = sales.filter(s => {
    const d = new Date(s.sale_date);
    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  });
  const monthRevenue = monthSales.reduce((a, s) => a + Number(s.sale_price || 0), 0);

  // Recent 5 sales
  const recentSales = sales.slice(0, 5);

  main.innerHTML = `
    <h2 style="margin-bottom:6px;">Dashboard</h2>
    <p style="color:var(--text-muted);font-size:14px;margin-bottom:20px;">📍 ${currentStore.name}</p>

    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-label">Available Stock</div>
        <div class="metric-value blue">${available.length}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Total Sold</div>
        <div class="metric-value green">${sold.length}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Total Revenue</div>
        <div class="metric-value green">${fmt(revenue)}</div>
      </div>
    </div>

    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-label">Today's Sales</div>
        <div class="metric-value blue">${todaySales.length}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Today's Revenue</div>
        <div class="metric-value blue">${fmt(todayRevenue)}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">This Month Sales</div>
        <div class="metric-value">${monthSales.length}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">This Month Revenue</div>
        <div class="metric-value">${fmt(monthRevenue)}</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
      <div class="card">
        <div class="card-title">💰 Recent Sales</div>
        ${recentSales.length ? `
          <table>
            <thead><tr><th>Phone</th><th>Price</th><th>Date</th></tr></thead>
            <tbody>
              ${recentSales.map(s => `
                <tr>
                  <td>${s.model}</td>
                  <td>${fmt(s.sale_price)}</td>
                  <td>${fmtDate(s.sale_date)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        ` : emptyState('No sales yet')}
      </div>
    </div>
  `;
}

function invRow(p, showStore) {
  const storeName = showStore ? allStores.find(s => s.id === p.store_id)?.name || '-' : null;
  return `<tr onclick="showPhoneDetail('${p.id}')" style="cursor:pointer;">
    <td style="font-family:monospace;font-size:12px;">${p.imei}</td>
    <td>${p.brand}</td><td>${p.model}</td>
    <td>${p.storage || '-'}</td><td>${p.color || '-'}</td>
    <td>${p.condition || '-'}</td>
    <td>${fmt(p.retail_price)}</td>
    <td><span class="badge badge-${p.status}">${p.status}</span></td>
    ${showStore ? `<td>${storeName}</td>` : ''}
    <td>${fmtDate(p.added_date)}</td>
  </tr>`;
}

function filterInventory() {
  const q = document.getElementById('invSearch').value.toLowerCase();
  const f = document.getElementById('invFilter').value;
  const rows = (window._invData || []).filter(p => {
    const matchSearch = !q || p.imei.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q) || p.model.toLowerCase().includes(q);
    const matchFilter = f === 'all' || p.status === f;
    return matchSearch && matchFilter;
  });

  document.getElementById('invCount').textContent = `Showing ${rows.length} phone${rows.length !== 1 ? 's' : ''}`;
  document.getElementById('invTableBody').innerHTML = rows.length
    ? rows.map(p => invRow(p, false)).join('')
    : `<tr><td colspan="9">${emptyState('No matching phones at this store')}</td></tr>`;

  // Show "Check Other Stores" button when searching and no/few results
  const otherDiv = document.getElementById('invOtherStores');
  if (q && q.length >= 2) {
    otherDiv.innerHTML = `
      <div style="text-align:center;padding:12px 0;border-top:0.5px solid var(--border);margin-top:12px;">
        <button class="btn btn-outline btn-sm" onclick="checkOtherStores()">
          🔍 Check other stores for "${document.getElementById('invSearch').value}"
        </button>
      </div>
    `;
  } else {
    otherDiv.innerHTML = '';
  }

  // Clear previous other-stores results when search changes
  document.getElementById('otherStoresResults').innerHTML = '';
}

async function checkOtherStores() {
  const q = document.getElementById('invSearch').value.toLowerCase();
  if (!q) return;

  const resultsDiv = document.getElementById('otherStoresResults');
  resultsDiv.innerHTML = `<div class="card" style="margin-top:16px;">${loading()}</div>`;

  // Fetch phones from ALL other stores
  const { data: phones } = await db.from('phones').select('*').neq('store_id', currentStore.id).eq('status', 'available').order('brand');
  const matches = (phones || []).filter(p =>
    p.imei.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q) || p.model.toLowerCase().includes(q)
  );

  if (matches.length === 0) {
    resultsDiv.innerHTML = `
      <div class="card" style="margin-top:16px;">
        <div class="card-title">📍 Other Stores</div>
        ${emptyState('Not found at any other store either')}
      </div>
    `;
    return;
  }

  // Group by store
  const byStore = {};
  matches.forEach(p => {
    const name = allStores.find(s => s.id === p.store_id)?.name || 'Unknown';
    if (!byStore[name]) byStore[name] = [];
    byStore[name].push(p);
  });

  resultsDiv.innerHTML = `
    <div class="card" style="margin-top:16px;">
      <div class="card-title">📍 Found at Other Stores (${matches.length} phone${matches.length !== 1 ? 's' : ''})</div>
      ${Object.entries(byStore).map(([store, phones]) => `
        <div style="margin-bottom:16px;">
          <div style="font-weight:600;font-size:14px;margin-bottom:8px;color:var(--primary);">📌 ${store} — ${phones.length} available</div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>IMEI</th><th>Brand</th><th>Model</th><th>Storage</th><th>Color</th><th>Condition</th><th>Retail</th></tr></thead>
              <tbody>
                ${phones.map(p => `
                  <tr onclick="showPhoneDetail('${p.id}')" style="cursor:pointer;">
                    <td style="font-family:monospace;font-size:12px;">${p.imei}</td>
                    <td>${p.brand}</td><td>${p.model}</td>
                    <td>${p.storage || '-'}</td><td>${p.color || '-'}</td>
                    <td>${p.condition || '-'}</td>
                    <td>${fmt(p.retail_price)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function downloadCsvTemplate() {
  const csv = 'brand,model,imei,color,storage,condition,cost,retail_price,notes\nApple,iPhone 15 Pro Max,123456789012345,Black,256GB,new,899.00,1199.00,Sample entry\n';
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'phonestock-import-template.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function handleCsvFile(file) {
  if (!file) return;
  if (!file.name.endsWith('.csv')) return toast('Please upload a .csv file', 'error');

  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result;
    parseCsvAndPreview(text);
  };
  reader.readAsText(file);
}

function parseCsvAndPreview(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(l => l);
  if (lines.length < 2) return toast('CSV file is empty or has no data rows', 'error');

  // Parse header
  const headers = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/['"]/g, ''));
  const requiredCols = ['brand', 'model', 'imei', 'retail_price'];
  const missing = requiredCols.filter(c => !headers.includes(c));
  if (missing.length) return toast('Missing required columns: ' + missing.join(', '), 'error');

  // Parse rows
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const values = parseCSVLine(lines[i]);
    const row = {};
    headers.forEach((h, j) => { row[h] = (values[j] || '').trim().replace(/^['"]|['"]$/g, ''); });
    // Auto-normalize brand and model names
    row._originalBrand = row.brand;
    row._originalModel = row.model;
    row.brand = normalizeBrand(row.brand);
    row.model = normalizeModel(row.brand, row.model);
    rows.push(row);
  }

  window._csvRows = rows;

  // Validate each row
  const validated = rows.map((r, i) => {
    const errors = [];
    if (!r.brand) errors.push('Missing brand');
    if (!r.model) errors.push('Missing model');
    if (!r.imei) errors.push('Missing IMEI');
    if (!r.retail_price || isNaN(Number(r.retail_price))) errors.push('Invalid retail_price');
    return { ...r, _rowNum: i + 2, _errors: errors };
  });

  window._csvValidated = validated;
  const validCount = validated.filter(r => r._errors.length === 0).length;
  const invalidCount = validated.filter(r => r._errors.length > 0).length;

  document.getElementById('csvPreview').innerHTML = `
    <div style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;">
      <div>
        <span style="font-size:14px;font-weight:600;">${rows.length} rows found</span>
        <span style="font-size:13px;color:var(--text-muted);margin-left:8px;">
          <span style="color:var(--success);">${validCount} valid</span>
          ${invalidCount ? `<span style="color:var(--danger);margin-left:6px;">${invalidCount} with errors</span>` : ''}
        </span>
      </div>
      ${validCount > 0 ? `<button class="btn btn-success" onclick="importCsvPhones()">Import ${validCount} Phone${validCount !== 1 ? 's' : ''}</button>` : ''}
    </div>
    <div class="table-wrap" style="max-height:400px;overflow-y:auto;">
      <table>
        <thead><tr><th>Row</th><th>Brand</th><th>Model</th><th>IMEI</th><th>Color</th><th>Storage</th><th>Condition</th><th>Cost</th><th>Retail</th><th>Status</th></tr></thead>
        <tbody>
          ${validated.map(r => {
            const hasErr = r._errors.length > 0;
            const brandFixed = r._originalBrand && r.brand !== r._originalBrand;
            const modelFixed = r._originalModel && r.model !== r._originalModel;
            return `<tr style="${hasErr ? 'background:rgba(163,45,45,0.08);' : ''}">
              <td>${r._rowNum}</td>
              <td>${brandFixed ? `<span title="Was: ${r._originalBrand}" style="color:var(--primary);">${r.brand} ✓</span>` : (r.brand || '-')}</td>
              <td>${modelFixed ? `<span title="Was: ${r._originalModel}" style="color:var(--primary);">${r.model} ✓</span>` : (r.model || '-')}</td>
              <td style="font-family:monospace;font-size:12px;">${r.imei || '-'}</td>
              <td>${r.color || '-'}</td>
              <td>${r.storage || '-'}</td>
              <td>${r.condition || 'new'}</td>
              <td>${r.cost ? fmt(r.cost) : '-'}</td>
              <td>${r.retail_price ? fmt(r.retail_price) : '-'}</td>
              <td>${hasErr ? `<span style="color:var(--danger);font-size:12px;">${r._errors.join(', ')}</span>` : '<span class="badge badge-available">Ready</span>'}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function parseCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { inQuotes = !inQuotes; }
    else if (ch === ',' && !inQuotes) { result.push(current); current = ''; }
    else { current += ch; }
  }
  result.push(current);
  return result;
}

async function importCsvPhones() {
  const validated = window._csvValidated;
  if (!validated) return;

  const validRows = validated.filter(r => r._errors.length === 0);
  if (!validRows.length) return toast('No valid rows to import', 'error');

  // Check for duplicate IMEIs within the CSV itself
  const imeis = validRows.map(r => r.imei);
  const dupeInFile = imeis.filter((v, i) => imeis.indexOf(v) !== i);
  if (dupeInFile.length) return toast('Duplicate IMEIs found in CSV: ' + [...new Set(dupeInFile)].join(', '), 'error');

  // Check for existing IMEIs in database
  const { data: existing } = await db.from('phones').select('imei').in('imei', imeis);
  const existingImeis = new Set((existing || []).map(p => p.imei));

  const newRows = validRows.filter(r => !existingImeis.has(r.imei));
  const skippedCount = validRows.length - newRows.length;

  if (!newRows.length) return toast('All IMEIs already exist in the system', 'error');

  // Build phone objects
  const phones = newRows.map(r => ({
    brand: r.brand,
    model: r.model,
    imei: r.imei,
    color: r.color || null,
    storage: r.storage || null,
    condition: r.condition || 'new',
    cost: r.cost ? Number(r.cost) : null,
    retail_price: Number(r.retail_price),
    notes: r.notes || null,
    store_id: currentStore.id,
    status: 'available'
  }));

  // Insert in batches of 50
  let imported = 0;
  let failed = 0;
  for (let i = 0; i < phones.length; i += 50) {
    const batch = phones.slice(i, i + 50);
    const { error } = await db.from('phones').insert(batch);
    if (error) { failed += batch.length; }
    else { imported += batch.length; }
  }

  // Show results
  let msg = `✅ ${imported} phone${imported !== 1 ? 's' : ''} imported to ${currentStore.name}`;
  if (skippedCount) msg += ` | ${skippedCount} skipped (duplicate IMEI)`;
  if (failed) msg += ` | ${failed} failed`;

  document.getElementById('csvPreview').innerHTML = `
    <div class="card" style="background:var(--sidebar-active);border-color:var(--primary);text-align:center;padding:24px;">
      <p style="font-size:16px;font-weight:600;color:var(--success);margin-bottom:8px;">Import Complete</p>
      <p style="font-size:14px;color:var(--text-secondary);">${msg}</p>
      <button class="btn btn-primary btn-sm" style="margin-top:12px;" onclick="renderAddPhone()">Import More</button>
    </div>
  `;

  toast(msg);
}

function onBrandChange() {
  const brand = document.getElementById('addBrand').value;
  const wrap = document.getElementById('modelFieldWrap');
  const models = MODEL_CATALOG[brand];

  if (models) {
    wrap.innerHTML = `
      <select id="addModel">

        `;
      }
    });
  } else {
    wrap.innerHTML = `<input type="text" id="addModel" placeholder="Enter model name">`;
  }
}

function normalizeModel(brand, model) {
  if (!brand || !model) return model;
  const brandKey = Object.keys(MODEL_CATALOG).find(b => b.toLowerCase() === brand.toLowerCase());
  if (!brandKey) return model;
  const models = MODEL_CATALOG[brandKey];
  const modelLower = model.toLowerCase().replace(/[^a-z0-9+ ]/g, '').replace(/\s+/g, ' ').trim();
  for (const std of models) {
    const stdLower = std.toLowerCase().replace(/[^a-z0-9+ ]/g, '').replace(/\s+/g, ' ').trim();
    if (modelLower === stdLower) return std;
  }
  return model;
}

function normalizeBrand(brand) {
  if (!brand) return brand;
  const known = ['Apple', 'Samsung', 'Google', 'OnePlus', 'Motorola', 'Xiaomi', 'Huawei', 'LG', 'Sony', 'Nokia'];
  const lower = brand.toLowerCase().trim();
  for (const b of known) {
    if (b.toLowerCase() === lower) return b;
  }
  return brand;
}

async function addPhoneFromCustomer() {
  const imei = document.getElementById('addImei').value.trim();
  const brand = document.getElementById('addBrand').value;
  const model = document.getElementById('addModel').value.trim();
  const cost = document.getElementById('addCost').value;
  const retail = document.getElementById('addRetail').value;
  const custName = document.getElementById('addCustName').value.trim();
  const custPhone = document.getElementById('addCustPhone').value.trim();
  const custPayment = document.getElementById('addCustPayment').value;

  if (!imei) return toast('Enter an IMEI', 'error');
  if (!brand) return toast('Select a brand', 'error');
  if (!model) return toast('Enter a model name', 'error');
  if (!cost) return toast('Enter a purchase price', 'error');
  if (!retail) return toast('Enter a retail price', 'error');
  if (!custName) return toast('Enter customer name', 'error');
  if (!custPhone) return toast('Enter customer phone', 'error');

  // Check uniqueness
  const { data: existing } = await db.from('phones').select('id').eq('imei', imei);
  if (existing && existing.length > 0) return toast('This IMEI already exists in the system', 'error');

  const storage = document.getElementById('addStorage').value;
  const color = document.getElementById('addColor').value.trim();
  const condition = document.getElementById('addCondition').value;
  const notes = document.getElementById('addNotes').value.trim();

  const phone = {
    imei, brand, model, storage, color, condition,
    cost: cost,
    retail_price: retail,
    notes,
    store_id: currentStore.id,
    status: 'available',
    source_type: 'customer',
    source_name: custName,
    source_phone: custPhone,
    source_payment_method: custPayment,
    staff_id: currentStaff?.id || null
  };

  const { data: phoneData, error } = await db.from('phones').insert([phone]).select().single();
  if (error) return toast('Failed to add phone: ' + error.message, 'error');

  // Log purchase
  await db.from('purchases').insert([{
    phone_id: phoneData.id,
    imei, model: `${brand} ${model}`,
    store_id: currentStore.id,
    purchase_price: cost,
    source_type: 'customer',
    source_name: custName,
    source_phone: custPhone,
    payment_method: custPayment
  }]);

  toast('Phone added successfully!');

  // Show success with options
  const formCard = document.querySelector('#addCustomer .card');
  const successHtml = `
    <div style="background:var(--sidebar-active);border:0.5px solid var(--primary);border-radius:var(--radius);padding:16px;margin-bottom:16px;">
      <p style="font-size:14px;font-weight:600;color:var(--success);margin-bottom:4px;">✅ Phone added: ${brand} ${model} (${imei})</p>
      <p style="font-size:13px;color:var(--text-secondary);">Bought from ${custName} for ${fmt(cost)} — Payment: ${custPayment}</p>
    </div>
  `;

  // Insert success message at top
  const existingSuccess = document.getElementById('custSuccessMsg');
  if (existingSuccess) existingSuccess.remove();
  const div = document.createElement('div');
  div.id = 'custSuccessMsg';
  div.innerHTML = successHtml;
  formCard.insertBefore(div, formCard.firstChild);

  // Clear only phone fields, keep customer info
  document.getElementById('addImei').value = '';
  document.getElementById('imeiHint').textContent = '';
  document.getElementById('addBrand').value = '';
  onBrandChange();
  document.getElementById('addStorage').value = '';
  document.getElementById('addColor').value = '';
  document.getElementById('addCondition').value = 'New with Box';
  document.getElementById('addCost').value = '';
  document.getElementById('addRetail').value = '';
  document.getElementById('addNotes').value = '';

  // Focus IMEI field for next phone
  document.getElementById('addImei').focus();
}

function addSupplierCsvUpload() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.csv';
  input.onchange = function() {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      const lines = e.target.result.split('\n').map(l => l.trim()).filter(l => l);
      if (lines.length < 2) return toast('CSV is empty', 'error');
      const headers = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/['"]/g, ''));
      for (let i = 1; i < lines.length; i++) {
        const values = parseCSVLine(lines[i]);
        const row = {};
        headers.forEach((h, j) => { row[h] = (values[j] || '').trim().replace(/^['"]|['"]$/g, ''); });
        // Normalize
        row.brand = normalizeBrand(row.brand || '');
        row.model = normalizeModel(row.brand, row.model || '');
        // Add row to table
        const id = window._supplierRowId++;
        const tbody = document.getElementById('supplierRows');
        const tr = document.createElement('tr');
        tr.id = `supRow${id}`;
        tr.innerHTML = `
          <td><input type="text" id="supImei${id}" value="${row.imei || ''}" style="width:130px;padding:6px 8px;border:0.5px solid var(--border);border-radius:5px;font-size:13px;background:var(--bg-input);color:var(--text);font-family:monospace;"></td>
          <td><select id="supBrand${id}" onchange="onSupplierBrandChange(${id})" style="width:100px;padding:6px 8px;border:0.5px solid var(--border);border-radius:5px;font-size:13px;background:var(--bg-input);color:var(--text);"><option value="">Brand</option><option ${row.brand==='Apple'?'selected':''}>Apple</option><option ${row.brand==='Samsung'?'selected':''}>Samsung</option><option ${row.brand==='Google'?'selected':''}>Google</option><option ${row.brand==='OnePlus'?'selected':''}>OnePlus</option><option ${row.brand==='Motorola'?'selected':''}>Motorola</option><option ${row.brand==='Xiaomi'?'selected':''}>Xiaomi</option><option ${row.brand==='Huawei'?'selected':''}>Huawei</option><option ${row.brand==='LG'?'selected':''}>LG</option><option ${row.brand==='Sony'?'selected':''}>Sony</option><option ${row.brand==='Nokia'?'selected':''}>Nokia</option><option ${row.brand&&!['Apple','Samsung','Google','OnePlus','Motorola','Xiaomi','Huawei','LG','Sony','Nokia'].includes(row.brand)?'selected':''}>Other</option></select></td>
          <td><div id="supModelWrap${id}"><input type="text" id="supModel${id}" value="${row.model || ''}" style="width:140px;padding:6px 8px;border:0.5px solid var(--border);border-radius:5px;font-size:13px;background:var(--bg-input);color:var(--text);"></div></td>
          <td><select id="supStorage${id}" style="width:80px;padding:6px 8px;border:0.5px solid var(--border);border-radius:5px;font-size:13px;background:var(--bg-input);color:var(--text);"><option value="">-</option><option ${row.storage==='32GB'?'selected':''}>32GB</option><option ${row.storage==='64GB'?'selected':''}>64GB</option><option ${row.storage==='128GB'?'selected':''}>128GB</option><option ${row.storage==='256GB'?'selected':''}>256GB</option><option ${row.storage==='512GB'?'selected':''}>512GB</option><option ${row.storage==='1TB'?'selected':''}>1TB</option></select></td>
          <td><input type="text" id="supColor${id}" value="${row.color || ''}" style="width:80px;padding:6px 8px;border:0.5px solid var(--border);border-radius:5px;font-size:13px;background:var(--bg-input);color:var(--text);"></td>
          <td><input type="number" id="supCost${id}" value="${row.cost || ''}" step="0.01" style="width:80px;padding:6px 8px;border:0.5px solid var(--border);border-radius:5px;font-size:13px;background:var(--bg-input);color:var(--text);"></td>
          <td><input type="number" id="supRetail${id}" value="${row.retail_price || ''}" step="0.01" style="width:80px;padding:6px 8px;border:0.5px solid var(--border);border-radius:5px;font-size:13px;background:var(--bg-input);color:var(--text);"></td>

        tbody.appendChild(tr);
      }
      updateSupplierRowCount();
      toast(`${lines.length - 1} rows loaded from CSV`);
    };
    reader.readAsText(file);
  };
  input.click();
}

async function saveSupplierOrder() {
  const supplierId = document.getElementById('supplierId').value;
  const invoice = document.getElementById('supplierInvoice').value.trim();
  const condition = document.getElementById('supplierCondition').value;

  if (!supplierId) return toast('Select a supplier', 'error');

  const supplierName = window._suppliers.find(s => s.id === supplierId)?.name || '';
  const rows = document.querySelectorAll('#supplierRows tr');
  const phones = [];
  const errors = [];

  rows.forEach((tr, idx) => {
    const id = tr.id.replace('supRow', '');
    const imei = document.getElementById(`supImei${id}`)?.value.trim();
    const brand = document.getElementById(`supBrand${id}`)?.value;
    const model = document.getElementById(`supModel${id}`)?.value.trim();
    const retail = document.getElementById(`supRetail${id}`)?.value;

    if (!imei && !brand && !model && !retail) return; // skip empty rows

    if (!imei) { errors.push(`Row ${idx+1}: Missing IMEI`); return; }
    if (!brand) { errors.push(`Row ${idx+1}: Missing brand`); return; }
    if (!model) { errors.push(`Row ${idx+1}: Missing model`); return; }
    if (!retail) { errors.push(`Row ${idx+1}: Missing retail price`); return; }

    phones.push({
      imei,
      brand,
      model: model === '__other__' ? '' : model,
      storage: document.getElementById(`supStorage${id}`)?.value || null,
      color: document.getElementById(`supColor${id}`)?.value.trim() || null,
      condition,
      cost: document.getElementById(`supCost${id}`)?.value || null,
      retail_price: retail,
      store_id: currentStore.id,
      status: 'available',
      source_type: 'supplier',
      source_name: supplierName,
      source_invoice: invoice,
      supplier_id: supplierId,
      staff_id: currentStaff?.id || null
    });
  });

  if (errors.length) return toast(errors[0], 'error');
  if (!phones.length) return toast('Add at least one phone', 'error');

  // Check for duplicate IMEIs within the batch
  const imeis = phones.map(p => p.imei);
  const dupes = imeis.filter((v, i) => imeis.indexOf(v) !== i);
  if (dupes.length) return toast('Duplicate IMEI in batch: ' + dupes[0], 'error');

  // Check against database
  const { data: existing } = await db.from('phones').select('imei').in('imei', imeis);
  const existingImeis = (existing || []).map(p => p.imei);
  if (existingImeis.length) return toast('IMEI already exists: ' + existingImeis[0], 'error');

  // Insert in batches
  let imported = 0;
  for (let i = 0; i < phones.length; i += 50) {
    const batch = phones.slice(i, i + 50);
    const { data: insertedPhones, error } = await db.from('phones').insert(batch).select();
    if (error) return toast('Failed to save: ' + error.message, 'error');
    imported += batch.length;

    // Log purchases
    const purchaseRecords = insertedPhones.map(p => ({
      phone_id: p.id,
      imei: p.imei,
      model: `${p.brand} ${p.model}`,
      store_id: currentStore.id,
      purchase_price: p.cost,
      source_type: 'supplier',
      source_name: supplierName,
      supplier_id: supplierId,
      source_invoice: invoice
    }));
    await db.from('purchases').insert(purchaseRecords);
  }

  toast(`${imported} phone${imported !== 1 ? 's' : ''} added from ${supplierName}`);
  renderAddPhone();
}

function updateSaleTotals() {
  const price = Number(document.getElementById('salePrice')?.value || 0);
  const gstOn = document.getElementById('gstToggle')?.checked;
  const pstOn = document.getElementById('pstToggle')?.checked;
  const payMethod = document.getElementById('payMethod')?.value;
  const isCashNoTax = payMethod === 'Cash' && !gstOn && !pstOn;

  const noteEl = document.getElementById('taxInclusiveNote');
  const subtotalRowEl = document.getElementById('subtotalRow');
  const subtotalEl = document.getElementById('saleSubtotal');

  if (isCashNoTax && price > 0) {
    // Back-calculate: price is the total (tax-inclusive)
    const subtotal = Math.round(price / 1.12 * 100) / 100;
    const gst = Math.round(subtotal * 0.05 * 100) / 100;
    const pst = Math.round(subtotal * 0.07 * 100) / 100;
    // Adjust to match exact total
    const adjustedPst = Math.round((price - subtotal - gst) * 100) / 100;

    if (document.getElementById('gstAmount')) document.getElementById('gstAmount').textContent = '$' + gst.toFixed(2);
    if (document.getElementById('pstAmount')) document.getElementById('pstAmount').textContent = '$' + adjustedPst.toFixed(2);
    if (subtotalEl) subtotalEl.textContent = '$' + subtotal.toFixed(2);
    if (document.getElementById('saleTotal')) document.getElementById('saleTotal').textContent = '$' + price.toFixed(2);
    if (noteEl) noteEl.style.display = 'block';
    if (subtotalRowEl) subtotalRowEl.style.display = 'flex';
  } else {
    // Normal: price is subtotal, taxes added on top
    const gst = gstOn ? Math.round(price * 0.05 * 100) / 100 : 0;
    const pst = pstOn ? Math.round(price * 0.07 * 100) / 100 : 0;
    const total = price + gst + pst;

    if (document.getElementById('gstAmount')) document.getElementById('gstAmount').textContent = gstOn ? '$' + gst.toFixed(2) : '—';
    if (document.getElementById('pstAmount')) document.getElementById('pstAmount').textContent = pstOn ? '$' + pst.toFixed(2) : '—';
    if (document.getElementById('saleTotal')) document.getElementById('saleTotal').textContent = '$' + total.toFixed(2);
    if (noteEl) noteEl.style.display = 'none';
    if (subtotalRowEl) subtotalRowEl.style.display = (gstOn || pstOn) ? 'none' : 'none';
  }
}

async function completeSale(phoneId) {
  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const price = document.getElementById('salePrice').value;

  if (!name) return toast('Enter customer name', 'error');
  if (!phone) return toast('Enter customer phone', 'error');
  if (!price) return toast('Enter sale price', 'error');

  const { data: p } = await db.from('phones').select('*').eq('id', phoneId).single();
  if (!p) return toast('Phone not found', 'error');

  // Calculate warranty expiry
  let warrantyMonths = parseInt(document.getElementById('warrantyPeriod').value);
  if (isNaN(warrantyMonths) || document.getElementById('warrantyPeriod').value === 'other') {
    warrantyMonths = parseInt(document.getElementById('warrantyCustomMonths')?.value) || 0;
  }

  let warrantyExpiry = null;
  const saleDate = new Date();
  if (warrantyMonths > 0) {
    const exp = new Date(saleDate);
    exp.setMonth(exp.getMonth() + warrantyMonths);
    warrantyExpiry = exp.toISOString();
  }

  const email = document.getElementById('custEmail').value.trim();
  const payMethod = document.getElementById('payMethod').value;
  const notes = document.getElementById('saleNotes').value.trim();

  // Tax calculations
  const enteredPrice = Number(price);
  const gstApplied = document.getElementById('gstToggle').checked;
  const pstApplied = document.getElementById('pstToggle').checked;
  const isCashNoTax = payMethod === 'Cash' && !gstApplied && !pstApplied;

  let subtotal, gstAmount, pstAmount, totalAmount;

  if (isCashNoTax) {
    // Cash no-tax: entered price is the total, back-calculate subtotal
    totalAmount = enteredPrice;
    subtotal = Math.round(enteredPrice / 1.12 * 100) / 100;
    gstAmount = Math.round(subtotal * 0.05 * 100) / 100;
    pstAmount = Math.round((totalAmount - subtotal - gstAmount) * 100) / 100;
  } else {
    // Normal: entered price is subtotal, taxes added on top
    subtotal = enteredPrice;
    gstAmount = gstApplied ? Math.round(subtotal * 0.05 * 100) / 100 : 0;
    pstAmount = pstApplied ? Math.round(subtotal * 0.07 * 100) / 100 : 0;
    totalAmount = subtotal + gstAmount + pstAmount;
  }

  const sale = {
    phone_id: phoneId,
    imei: p.imei,
    model: `${p.brand} ${p.model}`,
    store_id: currentStore.id,
    sale_price: subtotal,
    subtotal: subtotal,
    gst_amount: gstAmount,
    pst_amount: pstAmount,
    total_amount: totalAmount,
    gst_applied: isCashNoTax ? true : gstApplied,
    pst_applied: isCashNoTax ? true : pstApplied,
    customer_name: name,
    customer_phone: phone,
    customer_email: email,
    payment_method: payMethod,
    notes: isCashNoTax ? (notes ? notes + ' | Tax-inclusive cash sale' : 'Tax-inclusive cash sale') : notes,
    warranty_expiry: warrantyExpiry,
    staff_id: currentStaff?.id || null
  };

  const { data: saleData, error: saleErr } = await db.from('sales').insert([sale]).select().single();
  if (saleErr) return toast('Sale failed: ' + saleErr.message, 'error');

  const { error: updateErr } = await db.from('phones').update({ status: 'sold' }).eq('id', phoneId);
  if (updateErr) return toast('Failed to update phone status', 'error');

  toast(warrantyMonths > 0 ? `Sale completed! ${warrantyMonths}-month warranty generated.` : 'Sale completed!');

  // Generate invoice number
  const { count } = await db.from('sales').select('id', { count: 'exact', head: true });
  const invNum = `INV-${saleDate.getFullYear()}-${String(count || 1).padStart(4, '0')}`;

  // Show invoice
  showInvoice({
    invoiceNum: invNum,
    date: saleDate,
    customer: { name, phone, email },
    device: p,
    salePrice: subtotal,
    gstApplied: isCashNoTax ? true : gstApplied,
    pstApplied: isCashNoTax ? true : pstApplied,
    gstAmount, pstAmount, totalAmount,
    payMethod,
    warrantyMonths,
    warrantyExpiry: warrantyExpiry ? new Date(warrantyExpiry) : null,
    storeName: currentStore.name,
    notes: isCashNoTax ? (notes ? notes + ' | Tax-inclusive cash sale' : 'Tax-inclusive cash sale') : notes
  });
}

async function startTransfer(phoneId) {
  const { data: p } = await db.from('phones').select('*').eq('id', phoneId).single();
  if (!p) return;

  const otherStores = allStores.filter(s => s.id !== currentStore.id);

  document.getElementById('transferForm').innerHTML = `
    <div class="card" style="max-width:700px;margin-top:16px;">
      <div class="card-title">Transfer: ${p.brand} ${p.model} (${p.imei})</div>
      <div class="form-group">
        <label>Destination Store *</label>
        <select id="destStore">
          <option value="">Select destination</option>
          ${otherStores.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}
        </select>
      </div>
      <button class="btn btn-primary btn-block" onclick="completeTransfer('${p.id}')">Confirm Transfer</button>
    </div>
  `;
}

async function completeTransfer(phoneId) {
  const destId = document.getElementById('destStore').value;
  if (!destId) return toast('Select a destination store', 'error');

  const { data: p } = await db.from('phones').select('*').eq('id', phoneId).single();
  if (!p) return toast('Phone not found', 'error');

  const transfer = {
    phone_id: phoneId,
    imei: p.imei,
    model: `${p.brand} ${p.model}`,
    from_store_id: currentStore.id,
    to_store_id: destId
  };

  const { error: tErr } = await db.from('transfers').insert([transfer]);
  if (tErr) return toast('Transfer failed: ' + tErr.message, 'error');

  const { error: uErr } = await db.from('phones').update({ store_id: destId, status: 'available' }).eq('id', phoneId);
  if (uErr) return toast('Failed to update phone store', 'error');

  const destName = allStores.find(s => s.id === destId)?.name;
  toast(`Phone transferred to ${destName}`);
  renderTransfer();
}

function getWarrantyStatus(sale) {
  if (!sale.warranty_expiry) {
    return { label: 'No Warranty', badge: 'badge-missing', detail: 'No warranty provided' };
  }
  const now = new Date();
  const expiry = new Date(sale.warranty_expiry);
  const saleDate = new Date(sale.sale_date);

  if (expiry > now) {
    // Calculate remaining time
    const diffMs = expiry - now;
    const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
    let remaining;
    if (diffDays > 60) {
      remaining = Math.floor(diffDays / 30) + ' months left';
    } else if (diffDays > 1) {
      remaining = diffDays + ' days left';
    } else {
      remaining = 'Expires today';
    }

    // Calculate total warranty duration
    const totalMonths = Math.round((expiry - saleDate) / (1000 * 60 * 60 * 24 * 30));
    return { label: remaining, badge: 'badge-active', detail: `${totalMonths}-month warranty`, expiry, saleDate, totalMonths };
  } else {
    const diffMs = now - expiry;
    const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
    let ago;
    if (diffDays > 60) {
      ago = Math.floor(diffDays / 30) + ' months ago';
    } else if (diffDays > 1) {
      ago = diffDays + ' days ago';
    } else {
      ago = 'Yesterday';
    }
    const totalMonths = Math.round((expiry - saleDate) / (1000 * 60 * 60 * 24 * 30));
    return { label: 'Expired', badge: 'badge-expired', detail: `Expired ${ago}`, expiry, saleDate, totalMonths };
  }
}

async function searchWarranty() {
  const q = document.getElementById('warrantySearch').value.trim();
  if (!q) return toast('Enter a search term', 'error');

  document.getElementById('warrantyResults').innerHTML = loading();

  const { data: sales } = await db.from('sales').select('*').or(`customer_name.ilike.%${q}%,customer_phone.ilike.%${q}%,customer_email.ilike.%${q}%,imei.ilike.%${q}%`);

  const list = sales || [];

  // Sort: IMEI exact matches first, then active warranties first
  list.sort((a, b) => {
    const aImeiMatch = a.imei && a.imei.toLowerCase().includes(q.toLowerCase()) ? 0 : 1;
    const bImeiMatch = b.imei && b.imei.toLowerCase().includes(q.toLowerCase()) ? 0 : 1;
    if (aImeiMatch !== bImeiMatch) return aImeiMatch - bImeiMatch;
    const aActive = a.warranty_expiry && new Date(a.warranty_expiry) > new Date() ? 0 : 1;
    const bActive = b.warranty_expiry && new Date(b.warranty_expiry) > new Date() ? 0 : 1;
    return aActive - bActive;
  });

  window._warrantyResults = list;

  document.getElementById('warrantyResults').innerHTML = list.length ? `
    <div style="font-size:13px;color:var(--text-muted);margin-bottom:10px;">${list.length} record${list.length !== 1 ? 's' : ''} found</div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Customer</th><th>Phone</th><th>IMEI</th><th>Sale Price</th><th>Payment</th><th>Store</th><th>Sold</th><th>Warranty</th></tr></thead>
        <tbody>
          ${list.map((s, i) => {
            const ws = getWarrantyStatus(s);
            return `<tr onclick="showWarrantyDetail(${i})" style="cursor:pointer;">
              <td><strong>${s.customer_name}</strong><br><span style="font-size:12px;color:var(--text-muted);">${s.customer_phone || ''}</span></td>
              <td>${s.model || '-'}</td>
              <td style="font-family:monospace;font-size:12px;">${s.imei || '-'}</td>
              <td>${fmt(s.sale_price)}</td>
              <td>${s.payment_method || '-'}</td>
              <td>${allStores.find(st => st.id === s.store_id)?.name || '-'}</td>
              <td>${fmtDate(s.sale_date)}</td>
              <td><span class="badge ${ws.badge}">${ws.label}</span></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  ` : emptyState('No warranty records found');
}

  const s = window._warrantyResults[index];
  if (!s) return;

  const ws = getWarrantyStatus(s);
  const storeName = allStores.find(st => st.id === s.store_id)?.name || '-';

  // Fetch phone details for specs and source info
  let phoneDetail = null;
  if (s.phone_id) {
    const { data } = await db.from('phones').select('*').eq('id', s.phone_id).single();
    phoneDetail = data;
  }

// ─── PHYSICAL COUNT ───
async function renderCount() {
  const main = document.getElementById('mainContent');
  main.innerHTML = `
    <h2 style="margin-bottom:16px;">Physical Count — ${currentStore.name}</h2>
    <div class="tabs">
      <button class="tab active" onclick="showCountTab('new',this)">New Count</button>
      <button class="tab" onclick="showCountTab('history',this)">Count History</button>
    </div>
    <div id="countNewTab"></div>
    <div id="countHistoryTab" style="display:none;"></div>
  `;
  loadNewCount();
}

function showCountTab(tab, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('countNewTab').style.display = tab === 'new' ? 'block' : 'none';
  document.getElementById('countHistoryTab').style.display = tab === 'history' ? 'block' : 'none';
  if (tab === 'history') loadCountHistory();
}

async function loadNewCount() {
  const container = document.getElementById('countNewTab');
  container.innerHTML = loading();

  const { data: phones } = await db.from('phones').select('*').eq('store_id', currentStore.id).eq('status', 'available').order('brand');
  const list = phones || [];

  window._countData = list.map(p => ({ ...p, countStatus: null }));

  container.innerHTML = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px;">
        <div>
          <span style="font-size:14px;font-weight:600;" id="countProgress">0</span> / ${list.length} counted
          <span id="countMissingBadge" style="display:none;margin-left:10px;"><span class="badge badge-missing" id="countMissingNum">0 missing</span></span>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-outline btn-sm" onclick="markAllFound()">Mark All Found</button>
          <button class="btn btn-outline btn-sm" onclick="exportCountCSV()">Export CSV</button>
          <button class="btn btn-primary btn-sm" id="completeCountBtn" onclick="completeCount()" disabled>Complete Count</button>
        </div>
      </div>
      <div style="margin-bottom:12px;">
        <input type="text" id="countSearch" placeholder="Search by IMEI or model..." oninput="filterCountList()" style="width:100%;padding:9px 12px;border:0.5px solid var(--border);border-radius:7px;font-size:14px;background:var(--bg-input);color:var(--text);">
      </div>
      <div id="countList">
        ${list.length ? list.map((p, i) => countRowHtml(p, i)).join('') : emptyState('No available phones to count')}
      </div>
    </div>
    <div id="countResultArea"></div>
  `;
}

function countRowHtml(p, i) {
  return `<div class="count-row" id="countRow${i}" data-imei="${p.imei.toLowerCase()}" data-model="${(p.brand + ' ' + p.model).toLowerCase()}">
    <div class="count-info">
      <div class="count-model">${p.brand} ${p.model} ${p.storage || ''} ${p.color || ''}</div>
      <div class="count-imei">${p.imei}</div>
    </div>
    <div class="count-actions">
      <button class="btn btn-sm btn-success" onclick="markCount(${i},'found')" id="foundBtn${i}">Found</button>
      <button class="btn btn-sm btn-warning" onclick="markCount(${i},'missing')" id="missingBtn${i}">Missing</button>
    </div>
  </div>`;
}

function filterCountList() {
  const q = document.getElementById('countSearch').value.toLowerCase();
  document.querySelectorAll('.count-row').forEach(row => {
    const imei = row.getAttribute('data-imei') || '';
    const model = row.getAttribute('data-model') || '';
    row.style.display = (!q || imei.includes(q) || model.includes(q)) ? '' : 'none';
  });
}

function markCount(i, status) {
  window._countData[i].countStatus = status;
  const row = document.getElementById(`countRow${i}`);

  const foundBtn = document.getElementById(`foundBtn${i}`);
  const missingBtn = document.getElementById(`missingBtn${i}`);

  if (status === 'found') {
    foundBtn.style.outline = '2px solid var(--success)';
    foundBtn.style.opacity = '1';
    missingBtn.style.outline = 'none';
    missingBtn.style.opacity = '0.5';
    row.style.background = '';
  } else {
    missingBtn.style.outline = '2px solid var(--warning)';
    missingBtn.style.opacity = '1';
    foundBtn.style.outline = 'none';
    foundBtn.style.opacity = '0.5';
    row.style.background = 'rgba(163,45,45,0.06)';
  }

  updateCountProgress();
}

function updateCountProgress() {
  const data = window._countData;
  const counted = data.filter(p => p.countStatus).length;
  const missing = data.filter(p => p.countStatus === 'missing').length;

  document.getElementById('countProgress').textContent = counted;

  const missingBadge = document.getElementById('countMissingBadge');
  const missingNum = document.getElementById('countMissingNum');
  if (missing > 0) {
    missingBadge.style.display = 'inline';
    missingNum.textContent = `${missing} missing`;
  } else {
    missingBadge.style.display = 'none';
  }

  // Enable complete button only when all counted
  const btn = document.getElementById('completeCountBtn');
  if (counted === data.length && data.length > 0) {
    btn.disabled = false;
    btn.classList.remove('btn-primary');
    btn.classList.add('btn-success');
  } else {
    btn.disabled = true;
    btn.classList.remove('btn-success');
    btn.classList.add('btn-primary');
  }
}

function markAllFound() {
  window._countData.forEach((p, i) => markCount(i, 'found'));
}

function exportCountCSV() {
  const data = window._countData;
  const csv = 'IMEI,Brand,Model,Storage,Color,Retail Price,Status\n' +
    data.map(p => `${p.imei},${p.brand},${p.model},${p.storage || ''},${p.color || ''},${p.retail_price || ''},${p.countStatus || 'uncounted'}`).join('\n');

  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `physical-count-${currentStore.name}-${new Date().toISOString().split('T')[0]}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  toast('CSV exported!');
}

async function completeCount() {
  const data = window._countData;
  const uncounted = data.filter(p => !p.countStatus).length;
  if (uncounted > 0) return toast(`${uncounted} phones not yet counted`, 'error');

  const found = data.filter(p => p.countStatus === 'found');
  const missing = data.filter(p => p.countStatus === 'missing');
  const missingValue = missing.reduce((a, p) => a + Number(p.retail_price || 0), 0);

  // Save count to database
  const { data: countRecord, error: countErr } = await db.from('physical_counts').insert([{
    store_id: currentStore.id,
    expected_count: data.length,
    found_count: found.length,
    missing_count: missing.length
  }]).select().single();

  if (countErr) return toast('Failed to save count: ' + countErr.message, 'error');

  // Save individual items
  const items = data.map(p => ({
    count_id: countRecord.id,
    phone_id: p.id,
    imei: p.imei,
    model: `${p.brand} ${p.model}`,
    status: p.countStatus
  }));

  const { error: itemsErr } = await db.from('physical_count_items').insert(items);
  if (itemsErr) return toast('Failed to save count items: ' + itemsErr.message, 'error');

  toast('Count saved successfully!');
  showVarianceReport(countRecord.id, data, found, missing, missingValue);
}

function showVarianceReport(countId, allData, found, missing, missingValue) {
  const area = document.getElementById('countResultArea');
  area.innerHTML = `

              ${missing.map(p => `

                  <td style="font-family:monospace;font-size:12px;">${p.imei}</td>

                  <td>${p.storage || '-'}</td><td>${p.color || '-'}</td>
                  <td>${fmt(p.retail_price)}</td>
                  <td>
                    <select id="resolve_${p.id}" style="padding:5px 8px;border:0.5px solid var(--border);border-radius:5px;font-size:12px;background:var(--bg-input);color:var(--text);">
                      <option value="">Unresolved</option>
                      <option value="found_later">Found Later</option>
                      <option value="lost">Lost</option>
                      <option value="stolen">Stolen</option>
                      <option value="damaged">Damaged</option>
                      <option value="data_error">Data Entry Error</option>
                    </select>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
        <div style="margin-top:12px;">
          <div class="form-group">
            <label>Resolution Notes</label>
            <textarea id="resolutionNotes" placeholder="Any notes about the missing phones..."></textarea>
          </div>
          <button class="btn btn-primary btn-sm" onclick="saveResolutions('${countId}')">Save Resolutions</button>
        </div>
      ` : '<p style="color:var(--success);font-size:14px;text-align:center;padding:16px;">✅ All phones accounted for — no variance!</p>'}

      <div style="margin-top:20px;padding-top:16px;border-top:0.5px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-outline btn-sm" onclick="exportCountCSV()">Export CSV</button>
        <button class="btn btn-primary btn-sm" onclick="showEmailModal('${countId}')">📧 Email Report</button>
      </div>
    </div>
  `;
}

async function saveResolutions(countId) {
  const data = window._countData.filter(p => p.countStatus === 'missing');
  const notes = document.getElementById('resolutionNotes').value.trim();
  let resolved = 0;

  for (const p of data) {
    const resolution = document.getElementById(`resolve_${p.id}`)?.value;
    if (!resolution) continue;

    // Update count item
    await db.from('physical_count_items')
      .update({ resolution, resolution_notes: notes, resolved_at: new Date().toISOString() })
      .eq('count_id', countId)
      .eq('phone_id', p.id);

    // Update phone status based on resolution
    if (resolution === 'found_later') {
      // Phone is back — keep as available
      resolved++;
    } else if (resolution === 'lost' || resolution === 'stolen' || resolution === 'damaged') {
      await db.from('phones').update({ status: resolution }).eq('id', p.id);
      resolved++;
    } else if (resolution === 'data_error') {
      await db.from('phones').update({ status: 'data_error' }).eq('id', p.id);
      resolved++;
    }
  }

  if (resolved > 0) {
    toast(`${resolved} resolution${resolved !== 1 ? 's' : ''} saved`);
  } else {
    toast('No resolutions selected', 'error');
  }
}

async function sendEmailReport(countId) {
  const email = document.getElementById('reportEmail').value.trim();

  const missing = data.filter(p => p.countStatus === 'missing');

    `<tr><td style="padding:6px 10px;border:1px solid #ddd;font-family:monospace;font-size:12px;">${p.imei}</td><td style="padding:6px 10px;border:1px solid #ddd;">${p.brand}</td><td style="padding:6px 10px;border:1px solid #ddd;">${p.model}</td><td style="padding:6px 10px;border:1px solid #ddd;">${p.storage || '-'}</td><td style="padding:6px 10px;border:1px solid #ddd;">${p.color || '-'}</td><td style="padding:6px 10px;border:1px solid #ddd;">$${Number(p.retail_price||0).toFixed(2)}</td></tr>`
  ).join('');

  const htmlBody = `
    <div style="font-family:Arial,sans-serif;max-width:600px;margin:0 auto;">
      <h2 style="color:#C41E24;">📱 Gurus CPR PhoneStock — Physical Count Report</h2>
      <p><strong>Store:</strong> ${currentStore.name}</p>
      <p><strong>Date:</strong> ${new Date().toLocaleString()}</p>
      <hr style="border:none;border-top:1px solid #eee;margin:16px 0;">

        <tr><td style="padding:8px;font-weight:bold;">Expected Count</td><td style="padding:8px;">${data.length}</td></tr>
        <tr style="background:#f0fdf4;"><td style="padding:8px;font-weight:bold;color:#2e7d32;">Found</td><td style="padding:8px;color:#2e7d32;">${found.length}</td></tr>
        <tr style="background:#fef2f2;"><td style="padding:8px;font-weight:bold;color:#c62828;">Missing</td><td style="padding:8px;color:#c62828;">${missing.length}</td></tr>
        <tr style="background:#fef2f2;"><td style="padding:8px;font-weight:bold;color:#c62828;">Missing Value</td><td style="padding:8px;color:#c62828;">$${missingValue.toFixed(2)}</td></tr>
      </table>
      ${missing.length ? `
        <h3 style="color:#c62828;">⚠️ Missing Phones</h3>
        <table style="width:100%;border-collapse:collapse;">
          <thead><tr style="background:#f5f5f5;"><th style="padding:6px 10px;border:1px solid #ddd;text-align:left;">IMEI</th><th style="padding:6px 10px;border:1px solid #ddd;text-align:left;">Brand</th><th style="padding:6px 10px;border:1px solid #ddd;text-align:left;">Model</th><th style="padding:6px 10px;border:1px solid #ddd;text-align:left;">Storage</th><th style="padding:6px 10px;border:1px solid #ddd;text-align:left;">Color</th><th style="padding:6px 10px;border:1px solid #ddd;text-align:left;">Retail</th></tr></thead>
          <tbody>${missingRows}</tbody>
        </table>
      ` : '<p style="color:#2e7d32;">✅ All phones accounted for — no variance!</p>'}
      <hr style="border:none;border-top:1px solid #eee;margin:16px 0;">
      <p style="font-size:12px;color:#999;">Generated by Gurus CPR PhoneStock</p>
    </div>
  `;

  try {
    const res = await fetch(SUPABASE_URL + '/functions/v1/send-count-report', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + SUPABASE_KEY
      },
      body: JSON.stringify({
        to: email,
        cc: ccEmails,
        subject: `Physical Count Report — ${currentStore.name} — ${new Date().toLocaleDateString()}`,
        html: htmlBody
      })
    });

    if (res.ok) {
      toast('Report emailed successfully!');
      closeModal();
    } else {
      const err = await res.json().catch(() => ({}));
      toast('Email failed: ' + (err.error || 'Check Edge Function setup'), 'error');
    }
  } catch (e) {
    toast('Email failed: Edge Function not deployed yet. See setup instructions.', 'error');
  }
}

  const { data: counts } = await db.from('physical_counts').select('*').eq('store_id', currentStore.id).order('counted_at', { ascending: false });

  container.innerHTML = list.length ? `

        <table>
